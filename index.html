<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Football Field Sandbox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #0f172a; overflow: hidden; display: flex; justify-content: center; align-items: center; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        canvas { display: block; image-rendering: -moz-crisp-edges; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; z-index: 1; }
        canvas#gameCanvas { filter: brightness(1.03) saturate(1.13) contrast(1.025); outline: none; }
        #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: max(18px, env(safe-area-inset-bottom)); }
        :root { --ctl: clamp(84px, 22vmin, 116px); }
        #joystick-zone { width: var(--ctl); height: var(--ctl); flex: 0 0 auto; background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.55); border-radius: 50%; position: relative; pointer-events: auto; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; touch-action: none; box-sizing: border-box; }
        #joystick-knob { width: 38%; height: 38%; background: rgba(255,255,255,0.55); border: 0; border-radius: 50%; pointer-events: none; transition: transform 0.05s linear; position: relative; z-index: 1; }
        #action-btn { width: calc(var(--ctl) * 0.62); height: calc(var(--ctl) * 0.62); flex: 0 0 auto; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-family: monospace; font-weight: bold; color: rgba(255,255,255,0.85); font-size: clamp(12px, 3.6vmin, 18px); text-shadow: 1px 1px 0 rgba(0,0,0,0.6); margin-bottom: 16px; touch-action: none; user-select: none; -webkit-user-select: none; box-sizing: border-box; transition: background-color 0.06s, transform 0.06s; }
        #action-btn:active, #action-btn.active-touch { background: rgba(255,255,255,0.38); transform: scale(0.94); }
        @media (hover: hover) and (pointer: fine) { #mobile-controls, #joystick-zone, #action-btn { pointer-events: none !important; } }
    </style>
</head>
<body>
    <div id="mobile-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="action-btn">X</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        window._mpMirror = false; window._mpOverlay = false;

        // ===== Touch joystick + dive button (kept from the original) =====
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        const actionBtn = document.getElementById('action-btn');
        let joystick = { active: false, origX: 0, origY: 0, dx: 0, dy: 0, normX: 0, normY: 0 };
        function updateJoystick(clientX, clientY) {
            let dx = clientX - joystick.origX; let dy = clientY - joystick.origY; let maxDist = 40;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > maxDist) { dx = (dx/dist) * maxDist; dy = (dy/dist) * maxDist; }
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.dx = dx; joystick.dy = dy; joystick.normX = dx / maxDist; joystick.normY = dy / maxDist;
        }
        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            joystick.active = true; let touch = e.changedTouches[0];
            joystick.origX = touch.clientX; joystick.origY = touch.clientY;
            updateJoystick(touch.clientX, touch.clientY);
        }, {passive: false});
        joystickZone.addEventListener('touchmove', (e) => {
            if (!joystick.active) return;
            e.preventDefault(); e.stopPropagation();
            updateJoystick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        }, {passive: false});
        const resetJoystick = (e) => {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            joystick.active = false; joystick.dx = 0; joystick.dy = 0; joystick.normX = 0; joystick.normY = 0;
            joystickKnob.style.transform = `translate(0px, 0px)`;
        };
        joystickZone.addEventListener('touchend', resetJoystick);
        joystickZone.addEventListener('touchcancel', resetJoystick);

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault(); });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });
        const handleActionDown = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } keys['Space'] = true; actionBtn.classList.add('active-touch'); };
        const handleActionUp = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } keys['Space'] = false; actionBtn.classList.remove('active-touch'); };
        actionBtn.addEventListener('touchstart', handleActionDown, {passive: false});
        actionBtn.addEventListener('touchend', handleActionUp); actionBtn.addEventListener('touchcancel', handleActionUp);

        // ===== Field constants + camera (same values as the original) =====
        const FIELD_LENGTH_YARDS = 120; const FIELD_WIDTH_YARDS = 48; const X_STRETCH = 1.6;
        const SCREEN_SPEED_BLEND = 0.7;
        const FIELD_VIEW_PITCH = 0.90;
        const MOVE_PITCH = FIELD_VIEW_PITCH, MOVE_SKEW = 0;
        const FPXX = 3.75, FPXY = 2.125;
        let fieldNumberScale = 0.5;
        let pixelFieldCanvas = null;
        const screenShake = { x: 0, y: 0 };
        const CAMERA_ZOOM_FACTOR = 1.33;
        const camUnit = () => canvas.height * 0.0165 * CAMERA_ZOOM_FACTOR;
        let playerSizeScale = 1.5;
        const camera = { x: 34.9, y: 0, zoom: 45, baseZoom: 45, pitch: FIELD_VIEW_PITCH, skew: 0, target: null, currentX: 34.9, currentY: 0 };
        function camYFollow(ty) {
            const half = canvas.height * 0.5 / (camera.zoom * camera.pitch);
            const lim = FIELD_WIDTH_YARDS / 2 + 4 - half;
            if (lim <= 0) return 0;
            return Math.max(-lim, Math.min(lim, ty || 0));
        }
        function toScreen(yardX, yardY) {
            let dx = (yardX - camera.currentX) * camera.zoom * X_STRETCH; let dy = (yardY - camera.currentY) * camera.zoom;
            const renderCenterY = canvas.height * 0.5; let screenX = (canvas.width / 2) + dx + (dy * camera.skew) + screenShake.x; let screenY = renderCenterY + (dy * camera.pitch) + screenShake.y;
            return { x: screenX, y: screenY };
        }
        function worldDirSpeedMul(dx, dy) {
            const len = Math.hypot(dx, dy); if (len < 1e-6) return 1;
            dx /= len; dy /= len;
            const sp = Math.hypot(dx * X_STRETCH + dy * MOVE_SKEW, dy * MOVE_PITCH);
            return Math.pow(X_STRETCH / sp, SCREEN_SPEED_BLEND);
        }
        function screenInputToWorldDir(inputX, inputY) {
            let len = Math.sqrt(inputX * inputX + inputY * inputY); if (len < 0.0001) return { x: 0, y: 0, active: false };
            let ix = inputX / len, iy = inputY / len; let worldDy = iy / camera.pitch; let worldDx = (ix - worldDy * camera.skew) / X_STRETCH;
            let wl = Math.sqrt(worldDx * worldDx + worldDy * worldDy) || 1;
            return { x: worldDx / wl, y: worldDy / wl, mul: worldDirSpeedMul(worldDx, worldDy), active: true };
        }

        // ===== The one player you control =====
        const player = { sacked: 0, x: 34.9, y: 0, speed: 0.095, facing: -1, animTimer: 0, isDiving: false, diveTimer: 0, diveDirX: 0, diveDirY: 0, skinTone: '#d4a373', girth: 1.0, pxSeed: 0.37, vx: 0, vy: 0, runAmt: 0, hasMoved: false, idleMix: 0 };
        camera.target = player;
        // Offensive lineman at the 20 (field x=30), facing left, four-point stance
        const olineman = { x: 30, y: 0, facing: -1, girth: 1.3, skinTone: '#8d5524' };
        // Offensive line: center is the furthest forward (left); guards and tackles curve back away from him
        const LINE_SPACING = 1.7, LINE_CURVE = [0, 0.35, 1.0];   // sideways gap between linemen / how far each slot sits behind the center
        const offensiveLine = [-2, -1, 0, 1, 2].map(i => i === 0 ? olineman : { x: olineman.x + LINE_CURVE[Math.abs(i)], y: olineman.y + i * LINE_SPACING, facing: -1, girth: 1.3, skinTone: '#8d5524' });
        // Wide receiver split wide, facing left, staggered receiver stance
        const receivers = [   // two split out to the sidelines, a slot receiver up top, and the tight end by the bottom tackle
            { x: 30, y: -19, facing: -1, girth: 1.0, skinTone: '#b07a4f' },
            { x: 30, y: 19, facing: -1, girth: 1.0, skinTone: '#a0693f' },
            { x: 31, y: -14, facing: -1, girth: 1.0, skinTone: '#8d5524' },    // extra receiver on the top side, in the slot (just off the line)
            { x: 31.3, y: 5.1, facing: -1, girth: 1.0, skinTone: '#b07a4f' }  // tight end, next to the bottom tackle, same receiver stance
        ];
        // Running back lined up beside the QB, facing left, two-point stance (bent forward, hands resting on his knees)
        const runningBack = { x: 34.9, y: 2.8, facing: -1, girth: 0.9, skinTone: '#9c6b43' };

        const makeLinemanSprite = function (withBall, palOver) {
            let rows = ["............HTTH..", "...........HHTTHH.", "....PPP....HHHHHEM", "...PPPPJJJJHHHhHSM", "..PPPPPJBBJJhHHMMM", "..PPPPpJJBBJJhh...", "...PPPpJJJJJJ.....", "...PPPP.pPPJJ.....", "..PPpPP.PPpSSSSS...", "..GPP...GPPSsSlso..", "..WGG...WGG.oooooo.", "..CCC...CCC..dddd.."];
            const pal = Object.assign({o:'#b45309',l:'#fafafa',d:'#78350f',H:'#1e3a8a',T:'#fffefc',M:'#cbd5e1',E:'#0f172a',h:'#162c6b',J:'#1e3a8a',B:'#7fb0ff',S:'#d4a373',s:'#a8794d',P:'#172554',p:'#0f1a3d',G:'#c2c1c0',W:'#fffefc',C:'#343d47'}, palOver || {});
            rows = rows.map(r => r.padEnd(19, '.'));
            if (!withBall) {   // no ball: swap the hand-on-ball rows for an arm that reaches down so the arm drops straight down and the hand is planted flat on the turf
                rows[8] = "..PPpPP.PPpsSS".padEnd(19, '.'); rows[9] = "..GPP...GPP.sSS".padEnd(19, '.');
                rows[10] = "..WGG...WGG.sS".padEnd(19, '.'); rows[11] = "..CCC...CCC.sSS".padEnd(19, '.');
            }
            const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length; const g = c.getContext('2d');
            for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++) { const k = rows[y][x]; if (k !== '.') { g.fillStyle = pal[k]; g.fillRect(x, y, 1, 1); } }
            return c;
        };
        const linemanSprite = makeLinemanSprite(true), linemanSpriteNoBall = makeLinemanSprite(false);   // only the center holds the ball

        // ===== Defense: one defensive lineman lined up over the right guard =====
        const DEF_PAL = { H: '#991b1b', h: '#7f1d1d', J: '#b91c1c', B: '#fca5a5', P: '#e5e7eb', p: '#9ca3af', S: '#a8764a', s: '#7d5233' };   // red jersey, light pants, darker skin
        const dlineSprite = makeLinemanSprite(false, DEF_PAL);
        // 4-man front: a DL over each tackle and guard, set a few yards off the ball. The center helps double-team whoever is closest to the QB.
        const DL_GAP = 2.6;   // how far in front of the OL the DL line sets up (yards)
        const DL_SKINS = ['#7d5233', '#6b4423', '#8a5a3a', '#74492c'];
        for (const o of offensiveLine) { o.hx = o.x; o.hy = o.y; o.vx = 0; o.vy = 0; o.anim = 0; o.px = o.x; o.py = o.y; }
        const rushers = [0, 1, 3, 4].map((idx, i) => {   // tackle, guard, guard, tackle (the center, idx 2, is the helper)
            const bl = offensiveLine[idx];
            return { blk: bl, dl: { x: bl.x - DL_GAP, y: bl.y, hx: bl.x - DL_GAP, hy: bl.y, vx: 0, vy: 0, facing: 1, girth: 1.2, skinTone: DL_SKINS[i] },
                     vx: 0, vy: 0, anim: 0, engaged: 0, engagedNow: false, beaten: false, beatAt: 240, phase: 0, toQ: { x: 1, y: 0 }, lane: [-2.2, -0.8, 0.8, 2.2][i] };
        });
        const bodies = [...offensiveLine.map(o => ({ o, team: 0 })), ...rushers.map(r => ({ o: r.dl, team: 1, r }))];
        const D = { live: false, t: 0, sacked: false, help: rushers[1] };
        // Cornerbacks: one over each wide receiver (the two outside WRs and the slot WR; the tight end stays with the line).
        // They line up off the receiver, then back-pedal to a cushion and mirror him once the ball is hiked.
        const CB_GAP = 3.5, CB_BAIL = 6.0;   // yards off the receiver at the line / how deep they back up after the snap
        const CB_SKINS = ['#6b4423', '#8a5a3a', '#7d5233'];
        const corners = [0, 1, 2].map((idx, i) => {
            const w = receivers[idx];
            return { wr: w, x: w.x - CB_GAP, y: w.y, hx: w.x - CB_GAP, hy: w.y, vx: 0, vy: 0, facing: 1, girth: 1.0, skinTone: CB_SKINS[i], anim: i * 1.7 };
        });
        const CB_SPEED = 0.1;   // a hair slower than the receivers, so a good route gets separation
        // Shared helpers for every defensive back: movement mode (drives the animation) and an intercept point that leads a moving target
        function setDefMode(o, chase, faceX) {
            const spd = Math.hypot(o.vx, o.vy);
            const want = chase ? spd > 0.05 : Math.abs(o.vx) > 0.07;
            o.sprint = o.sprint ? (chase ? spd > 0.04 : Math.abs(o.vx) > 0.05) : want;   // hysteresis so he doesn't flicker between poses
            o.turned = o.sprint;
            o.mode = o.sprint ? 'sprint' : spd > 0.02 ? ((o.vx < 0 && Math.abs(o.vx) >= Math.abs(o.vy)) ? 'backpedal' : 'shuffle') : 'ready';
            if (o.sprint) o.facing = Math.abs(o.vx) > 0.015 ? (o.vx >= 0 ? 1 : -1) : o.facing;
            else o.facing = faceX;
        }
        function leadPoint(t, from, sp) {   // where to run to cut off a moving target
            const d = Math.hypot(t.x - from.x, t.y - from.y), f = Math.min(30, d / Math.max(sp, 0.05)) * 0.65;
            return { x: t.x + (t.vx || 0) * f, y: t.y + (t.vy || 0) * f };
        }
        function updateCorners() {
            const ps = ball.state, covering = D.live && ps !== 'center';
            for (const c of corners) {
                const w = c.wr;
                let tx = c.hx, ty = c.hy, sp = 0.12, chase = false, hold = false;
                if (covering) {
                    const dBall = Math.hypot(c.x - RT.cx, c.y - RT.cy);
                    if (ps === 'caught' && RT.carrier) { const p = leadPoint(RT.carrier, c, 0.115); tx = p.x; ty = p.y; sp = 0.115; chase = true; }   // tackle angle on the carrier
                    else if (ps === 'thrown' && RT.target && dBall < 16) { tx = RT.cx; ty = RT.cy; sp = 0.125; chase = true; }                     // break on the ball
                    else if (ps === 'loose' || D.sacked) { hold = true; }
                    else {
                        // man coverage: trail the receiver with inside leverage. He plays off the line, then closes his cushion the moment the receiver cuts.
                        const cut = Math.min(1, Math.abs(w.vy) / 0.07);
                        const cushion = (CB_GAP + Math.min(1.5, D.t * 0.02)) * (1 - 0.5 * cut);
                        const inside = Math.abs(w.y) > 2.5 ? (w.y < 0 ? 1 : -1) * 0.8 * (1 - 0.6 * cut) : 0;
                        tx = w.x + w.vx * 8 - cushion; ty = w.y + w.vy * 8 + inside; sp = CB_SPEED + 0.012 * cut;
                    }
                }
                const dx = tx - c.x, dy = ty - c.y, dist = Math.hypot(dx, dy);
                let step = hold ? 0 : Math.min(sp, dist); if (chase && dist < 1.1) step = 0;
                const mx = dist > 0.001 ? dx / dist * step : 0, my = dist > 0.001 ? dy / dist * step : 0;
                c.vx += (mx - c.vx) * 0.35; c.vy += (my - c.vy) * 0.35;
                if (!covering && dist < 0.02) { c.x = tx; c.y = ty; c.vx = c.vy = 0; } else { c.x += c.vx; c.y += c.vy; }
                c.anim += Math.hypot(c.vx, c.vy) * 3;
                c.reach = chase && ps === 'thrown' && dBallSafe(c) < 3.2;
                setDefMode(c, chase || !covering, w.x >= c.x ? 1 : -1);
            }
        }
        function dBallSafe(o) { return Math.hypot(o.x - RT.cx, o.y - RT.cy); }

        // ===== Receiver routes: every wide receiver runs 5 or 10 yards straight, then slants inward. When a pass is thrown, the receiver nearest to where it comes down adjusts to it. =====
        const wideReceivers = [receivers[0], receivers[1], receivers[2]];
        for (const w of receivers) { w.hx = w.x; w.hy = w.y; w.vx = 0; w.vy = 0; w.anim = 0; w.isWR = wideReceivers.includes(w); }
        const WR_SPEED = 0.105, WR_ADJ_SPEED = 0.17, CATCH_R = 2.0, CATCH_Z = 2.4;
        const RT = { live: false, t: 0, target: null, carrier: null, catchT: 0, cx: 0, cy: 0, kc: 1 };
        function routesStart() {
            RT.live = true; RT.t = 0; RT.target = null; RT.carrier = null; RT.catchT = 0;
            for (const w of wideReceivers) { w.x = w.hx; w.y = w.hy; w.vx = w.vy = 0; w.stem = Math.random() < 0.5 ? 5 : 10; w.facing = -1; }   // 5 or 10 yards before the slant
            for (const c of corners) { c.x = c.hx; c.y = c.hy; c.vx = c.vy = 0; c.turned = false; c.sprint = false; c.mode = 'ready'; c.reach = false; }
            for (const b of backers) { b.x = b.hx; b.y = b.hy; b.vx = b.vy = 0; b.turned = false; b.sprint = false; b.mode = 'ready'; b.reach = false; b.thr = null; }
        }
        // a pass has been thrown: find where it comes down within reach, and send the receiver nearest to that spot to it
        function assignCatch() {
            let kc = 1;
            for (let i = 0; i <= 30; i++) { const k = 0.85 + 0.15 * i / 30; if (2.0 * (1 - k) + 4 * ball.peak * k * (1 - k) <= CATCH_Z) { kc = k; break; } }
            const tc = kc * ball.T, cx = ball.ox + ball.dx * ball.range * kc, cy = ball.oy + ball.dy * ball.range * kc;
            let best = null, bd = 1e9;
            for (const w of wideReceivers) { const d = Math.hypot(cx - (w.x + w.vx * tc), cy - (w.y + w.vy * tc)); if (d < bd) { bd = d; best = w; } }
            RT.target = best; RT.cx = cx; RT.cy = cy; RT.kc = kc;
        }
        function updateReceivers() {
            if (!RT.live) return;
            const ps = ball.state;
            if (ps === 'center') {   // play is over: jog back to the line
                let home = true;
                for (const w of wideReceivers) {
                    const dx = w.hx - w.x, dy = w.hy - w.y, d = Math.hypot(dx, dy);
                    if (d > 0.03) { const st = Math.min(0.12, d); w.vx = dx / d * st; w.vy = dy / d * st; w.x += w.vx; w.y += w.vy; w.anim += st * 3; w.facing = w.vx > 0 ? 1 : -1; home = false; }
                    else { w.x = w.hx; w.y = w.hy; w.vx = w.vy = 0; }
                }
                if (home) { RT.live = false; RT.target = null; RT.carrier = null; for (const w of wideReceivers) w.facing = -1; }
                return;
            }
            RT.t++;
            const ramp = Math.min(1, RT.t / 10);
            for (const w of wideReceivers) {
                let dirx = 0, diry = 0, sp = 0, smooth = 0.3;
                if (w === RT.carrier) {   // caught it: keeps running upfield
                    const l = Math.hypot(w.vx, w.vy) || 1; dirx = w.vx / l; diry = w.vy / l; sp = WR_SPEED; if (l === 1 && !w.vx && !w.vy) { dirx = -1; }
                } else if (ps === 'loose') {   // incomplete (or the QB was sacked): the play is dead, he eases up
                    sp = 0; smooth = 0.12;
                } else if (w === RT.target && ps === 'thrown') {   // adjusts to the pass: goes to where it comes down
                    const dx = RT.cx - w.x, dy = RT.cy - w.y, d = Math.hypot(dx, dy);
                    if (d > 0.15) { dirx = dx / d; diry = dy / d; sp = Math.min(WR_ADJ_SPEED, d); }
                } else {   // the slant: straight up the field for 5 or 10 yards, then 45 degrees toward the middle
                    if (w.hx - w.x >= w.stem && Math.abs(w.y) > 2.5) { dirx = -0.707; diry = w.hy < 0 ? 0.707 : -0.707; }
                    else dirx = -1;
                    sp = WR_SPEED * ramp;
                }
                w.vx += (dirx * sp - w.vx) * smooth; w.vy += (diry * sp - w.vy) * smooth;
                w.x += w.vx; w.y += w.vy; w.anim += Math.hypot(w.vx, w.vy) * 3;
                w.facing = w.vx > 0.04 ? 1 : -1;
            }
        }

        // ===== Two middle linebackers (hook zones, a few yards behind the DL) and two deep safeties (a deep half each) =====
        const mkBacker = (role, x, y, skin, girth, side) => ({ role, side, x, y, hx: x, hy: y, vx: 0, vy: 0, facing: 1, girth, skinTone: skin, anim: x + y, turned: false, sprint: false, mode: 'ready', reach: false, thr: null });
        const linebackers = [mkBacker('lb', 24.5, -2.4, '#6b4423', 1.15, -1), mkBacker('lb', 24.5, 2.4, '#8a5a3a', 1.15, 1)];
        const safeties = [mkBacker('s', 17, -8.5, '#7d5233', 1.0, -1), mkBacker('s', 17, 8.5, '#74492c', 1.0, 1)];
        const backers = [...linebackers, ...safeties];
        const LOS = 30, LB_ZONE_X = 21, LB_SPEED = 0.105, S_SPEED = 0.116;
        function updateBackers() {
            const ps = ball.state, active = D.live && ps !== 'center', passing = active && (ps === 'snap' || ps === 'qb');
            const prog = Math.min(1, D.t / 35);   // the drop happens over ~0.6 seconds
            if (passing) for (const b of linebackers) b.thr = null;
            for (const b of backers) {
                let tx = b.hx, ty = b.hy, sp = 0.12, chase = false, hold = false, face = 1;
                if (active) {

            for (let y = 0; y < SZ; y++) for (let x = 0; x < SZ; x++) {
                const dx = x + .5 - C, dy = y + .5 - C, u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
                const t = Math.abs(u) / A; if (t >= 1) continue;
                const hw = B * Math.pow(1 - t * t, 0.7);                         // lens shape: pointed at the ends
                if (Math.abs(v) > hw) continue;
                const belly = dy > B * 0.3;
                let col = '#b45309';
                if (belly) col = '#8f3f08';
                if (dy > B * 0.75) col = '#78350f';                              // underside shadow
                if (dy < -B * 0.35 && Math.abs(v) < hw - 0.5) col = '#d4720f';   // top highlight
                if (Math.abs(u) > 1.5 && Math.abs(u) < 2.5) col = belly ? '#cdc8be' : '#f4f0e6';   // white college stripes
                else if (front && Math.abs(u) < 0.9 && Math.abs(v - lv) < 0.5) col = '#ded4be';   // thin laces
                g.fillStyle = col; g.fillRect(x, y, 1, 1);
            }
            flightCache.set(key, c); return c;
        }
        // snap, throw and loose ball: pixel ball + a blocky shadow on the turf
        // the DL and the guard blocking him: stance sprites before the snap, running / blocking poses after it
        // Lineman poses. P(pitch, armA1, armA2, armB1, armB2, legA1, legA2, legK1, legK2) - every pose has the same keys so they can be blended.
        // (leg angles are measured from the torso, so a leaning lineman needs negative thigh angles to keep his knees under him)
        const P = (pitch, a1, a2, b1, b2, l1, l2, k1, k2) => ({ pitch, armA1: a1, armA2: a2, armB1: b1, armB2: b2, legA1: l1, legA2: l2, legK1: k1, legK2: k2 });
        const mixPose = (A, B, t) => { const o = {}; for (const k in A) o[k] = A[k] + (B[k] - A[k]) * t; return o; };
        const STANCE_POSE = P(0.79, -1.0, -0.9, 0.1, 0.1, 0.55, -0.45, 0.7, 1.4);   // down in the stance, they rise out of it over the first few frames of the snap
        // exactly the QB's sprint cycle: legs scissor, knees drive up, arms pump (drawn with the QB's run bob, see drawDefense)
        function sprintPose(anim) {
            const sw = Math.sin(anim), c = Math.cos(anim), armQ = Math.round((anim - 1.2) / (Math.PI / 3)), aw = Math.sin(armQ * Math.PI / 3) / 0.866;
            return P(0.13, aw * (Math.PI / 3.4), -aw * (Math.PI / 3.4), 1.3 - 0.45 * aw, 1.3 + 0.45 * aw, -sw * (Math.PI / 2.7), sw * (Math.PI / 2.7), 1.6 * Math.max(0, c), 1.6 * Math.max(0, -c));
        }
        // pass-set: athletic stance, knees bent, feet under him, hands up at the chest. Moving = quick shuffle steps (feet alternate, knees lift),
        // engaged = short choppy steps while the hands punch into the DL.
        function blockPose(o, engaged, mv, beaten) {
            const s = Math.sin(o.anim * 1.8), c = Math.cos(o.anim * 1.8), ch = Math.sin(D.t * 0.45 + o.hx * 3), pn = Math.sin(D.t * 0.2 + o.hx * 3);
            const pitch = beaten ? 0.5 : 0.34;
            const arms = engaged ? [-1.15 - 0.1 * pn, -1.2 + 0.1 * pn, 0.4 - 0.2 * pn, 0.35 + 0.2 * pn] : beaten ? [-1.45, -1.55, 0.2, 0.2] : [-0.9, -1.0, 0.8, 0.7];
            const stepAmt = 0.3 * mv, chop = engaged ? 0.07 : 0;
            return P(pitch, arms[0], arms[1], arms[2], arms[3],
                -0.59 + stepAmt * s + chop * ch, -0.19 - stepAmt * s - chop * ch,
                0.4 + 0.5 * mv * Math.max(0, c) + 0.1 * (engaged ? Math.max(0, ch) : 0), 0.4 + 0.5 * mv * Math.max(0, -c) + 0.1 * (engaged ? Math.max(0, -ch) : 0));
        }
        // DL: low and driving into the blocker while he is held (hands fighting, short choppy steps)
        function rushBase(r) {
            const ch = Math.sin(D.t * 0.4 + r.phase);
            return P(0.42, -1.2 + 0.1 * ch, -1.1 - 0.1 * ch, 0.3, 0.3, -0.65 + 0.07 * ch, -0.2 - 0.07 * ch, 0.45 + 0.1 * Math.max(0, ch), 0.5 + 0.1 * Math.max(0, -ch));
        }
        // standing body height of a pose, same math the sprite uses to plant its feet, so switching to the run bob has no vertical pop (same trick as the QB)
        function baseHy(p) {
            const q = v => Math.round(v * 16) / 16, ip = q(p.pitch), ps = Math.sin(ip), pc = Math.cos(ip);
            const rel = (off, a, k) => { const A = a + ip, B = A + k; return off * ps + 0.2 * pc + Math.cos(A) * 2.7 + Math.cos(B) * 2.5; };
            return Math.round(PXS.GROUND - (Math.max(rel(-0.5, q(p.legA1), q(p.legK1)), rel(0.5, q(p.legA2), q(p.legK2))) + 0.9));
        }
        function drawDefense(behind) {
            const oScale = camera.zoom * 0.04, spx = Math.max(0.45, oScale * 2.9 * 1.22) * playerSizeScale;
            const list = (D.live ? offensiveLine.map(o => ({ o })) : []).concat(rushers.map(r => ({ o: r.dl, r })))
                .filter(e => (e.o.y <= player.y) === behind).sort((a, b) => a.o.y - b.o.y);
            const rise = Math.min(1, D.t / 10);   // 0 -> 1 over the first 10 frames after the hike
            for (const e of list) {
                const o = e.o, r = e.r, os = toScreen(o.x, o.y);
                ctx.save(); ctx.translate(Math.round(os.x), Math.round(os.y)); ctx.scale(o.facing, 1); ctx.imageSmoothingEnabled = false;
                if (!D.live) {
                    ctx.drawImage(dlineSprite, Math.round(-18 * spx * 0.5), Math.round(3 * oScale - dlineSprite.height * spx), Math.round(dlineSprite.width * spx), Math.round(dlineSprite.height * spx));
                } else {
                    let pose, plant = true, bob = 0, lean = 0;
                    if (r) {
                        const base = rushBase(r), v = Math.hypot(r.vx, r.vy) / 0.05;
                        const bl = r.engagedNow ? 0 : v >= 0.75 ? 1 : v >= 0.4 ? 0.5 : 0;   // snappy like the QB: full sprint -> one in-between frame -> driving pose
                        pose = base;
                        if (bl > 0) {
                            pose = mixPose(base, sprintPose(r.anim), bl); plant = false; lean = 0.2 * bl;
                            bob = bl * (Math.round(Math.abs(Math.cos(r.anim)) * 1.5) - 2) + (1 - bl) * (17 - baseHy(base));   // body sinks and rises with each stride
                        }
                    } else {
                        const rr = rushers.find(q => q.blk === o) || D.help, mv = Math.min(1, Math.hypot(o.vx, o.vy) / 0.07);
                        pose = blockPose(o, rr.engagedNow, mv, rr.beaten);
                    }
                    if (rise < 1) pose = mixPose(STANCE_POSE, pose, rise);
                    const isDL = !!r;
                    const spr = PXS.cached(Object.assign({
                        facing: o.facing, girth: o.girth, isRef: false, hasFlag: false, hasBall: false, ballScale: 1.4, skin: o.skinTone, plant: plant, bob: bob, lean: lean, breath: 0, toe: 1.5,
                        jersey: isDL ? '#b91c1c' : '#1e3a8a', pants: isDL ? '#e5e7eb' : '#172554', helmet: isDL ? '#991b1b' : '#1e3a8a', jerseyDetail: isDL ? '#fca5a5' : '#3b82f6',
                        helmetStripe: '#ffffff', pantsStripe: isDL ? '#991b1b' : '#ffffff'
                    }, pose));
                    ctx.imageSmoothingEnabled = spx < 1.6;
                    ctx.drawImage(spr, Math.round(-PXS.HX * spx), Math.round(3 * oScale - PXS.GROUND * spx), Math.round(PXS.W * spx), Math.round(PXS.H * spx));
                }
                ctx.restore();
            }
        }

        // wide receivers (staggered stance, then the QB's sprint cycle on his route, ball tucked after a catch) and the cornerbacks covering them
        const WR_STANCE = P(0.25, -0.6, -0.8, 0.7, 0.9, 0.35, -0.3, 0.3, 0.2);
        function drawReceiversAndCorners() {
            const oScale = camera.zoom * 0.04, spx = Math.max(0.45, oScale * 2.9 * 1.22) * playerSizeScale;
            const list = receivers.map(o => ({ o, wr: true })).concat(corners.map(o => ({ o, wr: false })), backers.map(o => ({ o, wr: false }))).sort((a, b) => a.o.y - b.o.y);
            for (const e of list) {
                const o = e.o, os = toScreen(o.x, o.y);
                let pose, plant = true, bob = 0, lean = 0, hasB = false, look;
                if (e.wr) {
                    pose = WR_STANCE;
                    if (o.isWR) {
                        const v = Math.hypot(o.vx, o.vy) / 0.1, bl = v >= 0.75 ? 1 : v >= 0.4 ? 0.5 : 0;
                        if (bl > 0) { pose = mixPose(WR_STANCE, sprintPose(o.anim), bl); plant = false; lean = 0.2 * bl; bob = bl * (Math.round(Math.abs(Math.cos(o.anim)) * 1.5) - 2) + (1 - bl) * (17 - baseHy(WR_STANCE)); }
                        if (o === RT.target && ball.state === 'thrown') pose = Object.assign({}, pose, { armA1: -1.6, armA2: -1.7, armB1: 0.2, armB2: 0.2 });   // hands out for the ball
                        if (o === RT.carrier) { hasB = true; pose = Object.assign({}, pose, { armA1: -0.2, armA2: -0.2, armB1: 1.4, armB2: 1.4 }); }   // ball tucked
                    }
                    look = { jersey: '#1e3a8a', pants: '#172554', helmet: '#1e3a8a', jerseyDetail: '#3b82f6', helmetStripe: '#ffffff', pantsStripe: '#ffffff' };
                } else {
                    const spd = Math.hypot(o.vx, o.vy), mv = Math.min(1, spd / 0.08), sw = Math.sin(o.anim * 1.6), co = Math.cos(o.anim * 1.6), md = o.mode || 'ready';
                    const READY = P(0.14, -0.5, -0.5, 0.7, 0.7, -0.1, 0.1, 0.3, 0.3);
                    if (md === 'sprint') { pose = sprintPose(o.anim); plant = false; lean = 0.2; bob = Math.round(Math.abs(Math.cos(o.anim)) * 1.5) - 2; }   // full run cycle: turned and running
                    else if (md === 'backpedal') {   // choppy, low back-pedal, hands out, eyes on the QB
                        pose = P(0.2, -0.75 - 0.2 * sw, -0.75 + 0.2 * sw, 0.8, 0.8, -0.4 + 0.42 * sw, -0.4 - 0.42 * sw, 0.5 + 0.6 * Math.max(0, co), 0.5 + 0.6 * Math.max(0, -co));
                    } else if (md === 'shuffle') {   // lateral slide: wide athletic base, quick alternating feet
                        pose = mixPose(blockPose(o, false, Math.max(0.7, mv), false), READY, 0.4);
                    } else {   // zone-ready: weight on the balls of his feet, slight bounce, hands up
                        pose = mixPose(READY, blockPose(o, false, 0, false), 0.5);
                    }
                    if (o.reach) pose = Object.assign({}, pose, { armA1: -1.6, armA2: -1.7, armB1: 0.2, armB2: 0.2 });   // hands up to break up the pass
                    look = { jersey: '#b91c1c', pants: '#e5e7eb', helmet: '#991b1b', jerseyDetail: '#fca5a5', helmetStripe: '#ffffff', pantsStripe: '#991b1b' };
                }
                const spr = PXS.cached(Object.assign({
                    facing: o.facing, girth: o.girth, isRef: false, hasFlag: false, hasBall: hasB, ballScale: 0.7, skin: o.skinTone, plant: plant, bob: bob, lean: lean, breath: 0, toe: 1.5
                }, look, pose));
                ctx.save(); ctx.translate(Math.round(os.x), Math.round(os.y)); ctx.scale(o.facing, 1);
                ctx.imageSmoothingEnabled = spx < 1.6;
                ctx.drawImage(spr, Math.round(-PXS.HX * spx), Math.round(3 * oScale - PXS.GROUND * spx), Math.round(PXS.W * spx), Math.round(PXS.H * spx));
                ctx.restore();
            }
        }

        function drawSnapBall(spx) {
            if (ball.state !== 'snap' && ball.state !== 'thrown' && ball.state !== 'loose') return;
            const s = Math.max(2, Math.round(spx * 0.85)), m = Math.max(1, Math.round(spx)), lift = camera.zoom * 0.9;   // m = whole-number ball pixel size, so every ball pixel is identical
            const g = toScreen(ball.x, ball.y), sh = Math.max(0.5, 1 - ball.z * 0.12);
            ctx.imageSmoothingEnabled = false;
            ctx.fillStyle = 'rgba(0,0,0,0.22)';
            ctx.fillRect(Math.round(g.x - 2 * s * sh), Math.round(g.y - s * 0.5), Math.round(4 * s * sh), s);
            const sx = Math.round(g.x), sy = Math.round(g.y - ball.z * lift);
            if (ball.state === 'thrown') {
                // point the nose along the actual on-screen path, spin the laces
                const k = Math.min(1, ball.t / ball.T), k2 = Math.min(1, k + 0.03), k1 = Math.max(0, k2 - 0.03);
                const at = kk => { const q = toScreen(ball.ox + ball.dx * ball.range * kk, ball.oy + ball.dy * ball.range * kk); return [q.x, q.y - (2.0 * (1 - kk) + 4 * ball.peak * kk * (1 - kk)) * lift]; };
                const p0 = at(k1), p1 = at(k2); let ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
                if (Math.cos(ang) < 0) ang += Math.PI;
                ang += Math.sin(ball.t * 0.45) * 0.07;                         // slight wobble so it reads as a spiral                          // keep the shaded belly on the bottom
                let aq = Math.round(ang / (Math.PI / 16)); aq = ((aq % 16) + 16) % 16;
                const spr = flightBall(aq, Math.floor(ball.t * 0.75) % FB_PHASES), w = spr.width * m;
                ctx.drawImage(spr, Math.round(sx - w / 2), Math.round(sy - w / 2), Math.round(w), Math.round(w));
                return;
            }
            if (ball.state === 'loose') {
                const spr = flightBall(0, 0), w = spr.width * m; ctx.drawImage(spr, Math.round(sx - w / 2), Math.round(sy - w / 2), Math.round(w), Math.round(w));
                return;
            }
            const spr = flightBall(Math.floor(ball.t * 0.9) % 16, 0);
            const w = spr.width * m, h = w;
            ctx.drawImage(spr, Math.round(g.x - w / 2), Math.round(sy - h / 2), w, h);
        }

        // trajectory preview: pixel dots spaced evenly by distance along the arc (so they don't crawl or jump when you drag), landing mark at the end
        function drawAimLine(spx) {
            const th = computeThrow(); if (!th) return;
            const m = Math.max(1, Math.round(spx)), lift = camera.zoom * 0.9;   // m = one art pixel (same as the football and players)
            const peak = th.peak, z0 = 2.0, N = 120;
            const sc0 = toScreen(player.x, player.y), xoff = -2.5 * spx * player.facing * aim.mix;   // arc starts at the cocked ball
            const pts = []; let total = 0;
            for (let i = 0; i <= N; i++) {
                const k = i / N;
                const sc = toScreen(player.x + th.dx * th.range * k, player.y + th.dy * th.range * k);
                const z = z0 * (1 - k) + 4 * peak * k * (1 - k);
                const pt = { x: sc.x + xoff * (1 - k), y: sc.y - z * lift, gx: sc.x, gy: sc.y, s: 0 };
                if (i > 0) { total += Math.hypot(pt.x - pts[i - 1].x, pt.y - pts[i - 1].y); } pt.s = total; pts.push(pt);
            }
            ctx.imageSmoothingEnabled = false;
            const OUTLINE = '#0b2a16', FILL = '#ffffff', R = Math.round;
            const gap = m * 4, fade = Math.min(1, aim.mix * 1.5);
            ctx.globalAlpha = fade;
            let j = 0;
            for (let sd = gap; sd < total - m * 3; sd += gap) {          // stop short of the landing mark
                while (j < N - 1 && pts[j + 1].s < sd) j++;
                const a0 = pts[j], a1 = pts[j + 1], u = (sd - a0.s) / ((a1.s - a0.s) || 1);
                const x = Math.round((a0.x + (a1.x - a0.x) * u) / m) * m, y = Math.round((a0.y + (a1.y - a0.y) * u) / m) * m;   // snapped to the pixel grid
                ctx.fillStyle = OUTLINE; ctx.fillRect(x - m, y - m, m * 3, m * 3);   // one-pixel outline
                ctx.fillStyle = FILL; ctx.fillRect(x, y, m, m);                        // one-pixel dot
            }
            // landing mark: pixel plus with an outline
            const L = pts[N], lx = Math.round(L.gx / m) * m, ly = Math.round(L.gy / m) * m;
            const cells = []; for (let i = -2; i <= 2; i++) { cells.push([i, 0]); if (i) cells.push([0, i]); }   // 5x5 pixel plus
            ctx.fillStyle = OUTLINE; for (const [cx, cy] of cells) ctx.fillRect(lx + cx * m - m, ly + cy * m - m, m * 3, m * 3);
            ctx.fillStyle = '#fde047'; for (const [cx, cy] of cells) ctx.fillRect(lx + cx * m, ly + cy * m, m, m);
            ctx.globalAlpha = 1;
        }

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; ctx.imageSmoothingEnabled = false; camera.baseZoom = camUnit(); camera.zoom = camera.baseZoom; }

        let lastTime = 0, accumulator = 0; const timeStep = 1000 / 60;
        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let frameTime = timestamp - lastTime; lastTime = timestamp;
            if (frameTime > 100) frameTime = 100;
            accumulator += frameTime;
            while (accumulator >= timeStep) { update(); accumulator -= timeStep; }
            drawGame();
            requestAnimationFrame(loop);
        }

        try { pixelFieldCanvas = buildPixelField(null); } catch (e) { console.error(e); }
        window.addEventListener('resize', resize); resize();
        camera.currentX = player.x; camera.currentY = camYFollow(player.y);
        requestAnimationFrame(loop);
    </script>

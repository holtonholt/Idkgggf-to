<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>Retro Football</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #0f172a; overflow: hidden; display: flex; justify-content: center; align-items: center; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        canvas { display: block; image-rendering: -moz-crisp-edges; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; image-rendering: pixelated; z-index: 1; }
        canvas#gameCanvas { filter: brightness(1.03) saturate(1.13) contrast(1.025); outline: none; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; font-family: 'Press Start 2P', monospace; color: white; text-align: center; text-shadow: 4px 4px 0px #000; }
        .ui-panel { background-color: rgba(15, 23, 42, 0.97); border: 4px solid #ffffff; border-radius: 10px; padding: 32px 40px; pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 10px 10px 0px rgba(0,0,0,0.8); position: relative; overflow: hidden; width: min(90vw, 480px); box-sizing: border-box; }
        .ui-panel.result-panel { width: min(84vw, 340px); padding: clamp(16px, 5vw, 28px); gap: 10px; }
        .ui-panel::before { content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 60px; height: 20px; background: #94a3b8; border: 4px solid #fff; border-radius: 10px; }
        .result-headline { font-family: 'Press Start 2P', monospace; font-size: clamp(18px, 6.5vw, 30px); text-shadow: 3px 3px 0 #000; line-height: 1.3; margin: 0; }
        .result-sub { font-family: 'Press Start 2P', monospace; font-size: clamp(11px, 3.6vw, 16px); color: #cbd5e1; margin: 0; line-height: 1.4; }
        .result-yardage { font-family: 'Press Start 2P', monospace; font-size: clamp(13px, 4.6vw, 22px); text-shadow: 2px 2px 0 #000; margin: 0; }
        .result-yardage.gain { color: #4ade80; } .result-yardage.loss { color: #f87171; } .result-yardage.neutral { color: #9ca3af; }
        .result-down { font-family: 'Press Start 2P', monospace; font-size: clamp(10px, 3.4vw, 16px); color: #facc15; text-shadow: 2px 2px 0 #000; margin: 0; letter-spacing: 0.5px; }
        .result-down.turnover { color: #f87171; font-size: clamp(12px, 3.8vw, 18px); }
        .retro-btn { background-color: #2563eb; color: white; border: 4px solid #ffffff; border-radius: 6px; padding: 15px 30px; font-family: 'Press Start 2P', monospace; font-size: 16px; cursor: pointer; transition: all 0.1s; text-shadow: 2px 2px 0px #000; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.4), 4px 4px 0 rgba(0,0,0,0.8); }
        .retro-btn:hover { background-color: #3b82f6; transform: translateY(-2px); box-shadow: inset 0 -4px 0 rgba(0,0,0,0.4), 6px 6px 0 rgba(0,0,0,0.8); }
        .retro-btn:active { transform: translateY(2px); box-shadow: inset 0 0px 0 rgba(0,0,0,0.4), 0px 0px 0 rgba(0,0,0,0.8); }
        .retro-coin { width: 80px; height: 80px; background: radial-gradient(circle, #fde047 0%, #eab308 60%, #a16207 100%); border: 4px solid #4d2c0b; border-radius: 50%; margin: 20px 0; animation: coinFlip 0.4s infinite linear; box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 10px 0px rgba(0,0,0,0.6); position: relative; transform-style: preserve-3d; }
        .retro-coin::after { content: '$'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #4d2c0b; font-size: 40px; text-shadow: none; }
        @keyframes coinFlip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        .playbook-svg { width: 140px; height: 140px; background-color: #0f661e; border: 4px solid #ffffff; box-shadow: 6px 6px 0px rgba(0,0,0,0.8); image-rendering: pixelated; flex-shrink: 0; }
        .playbook-svg rect, .playbook-svg line, .playbook-svg polyline, .playbook-svg path { shape-rendering: crispEdges; }
        .route-path { stroke: #ff003c; stroke-width: 4; fill: none; }
        .playbook-svg.pf { background-color: #256f3a; border-radius: 6px; image-rendering: auto; }
        .playbook-svg.pf rect, .playbook-svg.pf line, .playbook-svg.pf polyline, .playbook-svg.pf path, .playbook-svg.pf circle { shape-rendering: geometricPrecision; }
        .pf .route-path { stroke: #fde047; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .pf .route-out { stroke: #0b1220; stroke-width: 5.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .pf .pf-def path { stroke: #f87171; stroke-width: 2.2; stroke-linecap: round; fill: none; }
        .pf .pf-off circle { fill: #22d3ee; stroke: #fff; stroke-width: 1.4; }
        .pf g[stroke="#fff"] { stroke: #fff; stroke-width: 1.6; stroke-dasharray: 3,2.5; stroke-linecap: round; opacity: .85; }
        .hud-text { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: 100%; text-align: center; font-family: 'Press Start 2P', monospace; color: white; font-size: 20px; text-shadow: 2px 2px 0 #000; z-index: 9; transition: transform 0.1s; }
        #scoreboard { position: absolute; top: 15px; left: 50%; transform: translateX(-50%) scale(var(--scoreboard-scale, .7)); transform-origin: top center; z-index: 8; display: flex; align-items: stretch; font-family: 'Press Start 2P', monospace; background-color: rgba(10, 15, 25, 0.95); border: 4px solid #ffffff; box-shadow: 6px 6px 0px rgba(0,0,0,0.8); border-radius: 4px; overflow: hidden; user-select: none; }
        #scoreboard .sb-team { display: flex; align-items: center; gap: 12px; padding: 10px 16px; transition: background-color 0.3s; }
        #scoreboard .sb-team.you { background-color: rgba(59, 130, 246, 0.3); } #scoreboard .sb-team.cpu { background-color: rgba(239, 68, 68, 0.3); }
        #scoreboard .sb-label { font-size: 12px; color: #cbd5e1; } #scoreboard .sb-score { font-size: 20px; color: #ffffff; min-width: 24px; text-align: center; }
        #scoreboard .sb-possession { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid #facc15; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; filter: drop-shadow(2px 2px 0 #000); }
        #scoreboard .sb-possession.show { opacity: 1; animation: pulsePoss 1s infinite; } #scoreboard .sb-possession.flip { border-left: none; border-right: 12px solid #facc15; }
        @keyframes pulsePoss { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        #scoreboard .sb-center { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 20px; border-left: 4px solid #fff; border-right: 4px solid #fff; background-color: rgba(255,255,255,0.1); }
        #scoreboard .sb-quarter { font-size: 12px; color: #facc15; margin-bottom: 6px; text-shadow: 2px 2px 0 #000; }
        #scoreboard .sb-clock { font-size: 16px; color: #4ade80; text-shadow: 2px 2px 0 #000; } #scoreboard .sb-clock.low { color: #f87171; animation: flashClock 0.5s infinite; }
        @keyframes flashClock { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #play-clock { position: absolute; top: 85px; left: 50%; transform: translateX(-50%); z-index: 9; display: none; flex-direction: column; align-items: center; font-family: 'Press Start 2P', monospace; background-color: rgba(10, 15, 25, 0.9); border: 3px solid #facc15; border-radius: 6px; padding: 6px 14px; box-shadow: 4px 4px 0px rgba(0,0,0,0.8); }
        #play-clock.show { display: flex; } #play-clock .pc-label { font-size: clamp(7px, 2vw, 9px); color: #facc15; letter-spacing: 1px; margin-bottom: 4px; white-space: nowrap; } #play-clock .pc-value { font-size: clamp(14px, 4vw, 18px); color: #4ade80; } #play-clock .pc-value.low { color: #f87171; animation: flashClock 0.25s infinite; }
        #down-distance { position: absolute; top: 85px; left: 50%; transform: translateX(-50%); z-index: 9; display: none; font-family: 'Press Start 2P', monospace; font-size: clamp(11px, 3.4vw, 14px); color: #facc15; letter-spacing: 1px; background-color: rgba(10, 15, 25, 0.9); border: 3px solid #facc15; border-radius: 6px; padding: 8px 16px; box-shadow: 4px 4px 0px rgba(0,0,0,0.8); white-space: nowrap; }
        #down-distance.show { display: block; } #play-clock.show ~ #down-distance { top: 135px; }
        .playcall-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; margin-top: 8px; }
        .playcall-special { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; margin-top: 14px; } .playcall-special .retro-btn { width: 100%; }
        .play-card { background-color: #1e293b; border: 3px solid #ffffff; border-radius: 8px; padding: 10px 14px; cursor: pointer; transition: transform 0.1s, border-color 0.1s, background-color 0.1s; display: flex; flex-direction: row; align-items: center; gap: 14px; box-shadow: 4px 4px 0px rgba(0,0,0,0.8); position: relative; width: 100%; box-sizing: border-box; }
        .play-card:hover { border-color: #facc15; background-color: #24334a; } .play-card:active { transform: scale(0.97); box-shadow: 1px 1px 0px rgba(0,0,0,0.8); }
        .play-title { font-family: 'Press Start 2P', monospace; font-size: clamp(10px, 3.2vw, 13px); color: white; text-shadow: 2px 2px 0px #000; text-align: left; flex: 1; }
        .playbook-svg.menu-icon { width: 56px; height: 56px; border-width: 2px; border-radius: 4px; }
        @media (min-width: 620px) { .playcall-grid { flex-direction: row; flex-wrap: wrap; justify-content: center; max-width: 600px; } .playcall-special { flex-direction: row; max-width: none; } .playcall-special .retro-btn { width: auto; } .play-card { flex-direction: column; gap: 12px; padding: 14px; width: auto; } .play-title { text-align: center; } .playbook-svg.menu-icon { width: 120px; height: 120px; border-width: 4px; } }
        @media (max-width: 400px) { .ui-panel { padding: 18px 14px; } .ui-panel.result-panel { padding: 14px; } }
        @media (max-height: 500px) { .ui-panel { padding: 10px 16px; gap: 6px; } .playcall-grid, .playcall-special { gap: 6px; margin-top: 4px; } .play-card { padding: 6px 10px; } .playbook-svg.menu-icon { width: 40px; height: 40px; } }
        #td-banner { position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%) scale(0.3); z-index: 20; text-align: center; font-family: 'Press Start 2P', monospace; pointer-events: none; opacity: 0; }
        #td-banner.show { animation: tdPopIn 0.6s cubic-bezier(.2,1.6,.4,1) forwards; } #td-banner.hide { animation: tdPopOut 0.4s ease-in forwards; }
        #td-banner .td-main { font-size: 72px; color: #facc15; -webkit-text-stroke: 4px #000; text-shadow: 6px 6px 0px #b91c1c, 10px 10px 0px rgba(0,0,0,0.6); letter-spacing: 2px; animation: tdPulse 0.5s ease-in-out infinite; white-space: nowrap; font-style: italic; }
        #td-banner .td-sub { margin-top: 20px; font-size: 26px; color: #ffffff; text-shadow: 4px 4px 0px #000; animation: tdFadeUp 0.5s ease-out 0.4s both; background: rgba(0,0,0,0.5); display: inline-block; padding: 10px 20px; border: 3px solid #fff; }
        @keyframes tdPopIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-10deg); } 60% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(5deg); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); } }
        @keyframes tdPopOut { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } }
        @keyframes tdPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes tdFadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        #penalty-toast { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%) scale(0.5); z-index: 25; font-family: 'Press Start 2P', monospace; font-size: 20px; color: #fb923c; text-shadow: 3px 3px 0px #000; background: rgba(15, 23, 42, 0.95); border: 4px solid #fb923c; padding: 16px 24px; opacity: 0; pointer-events: none; white-space: nowrap; box-shadow: 6px 6px 0 rgba(0,0,0,0.8); }
        #penalty-toast.show { animation: toastPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; } #penalty-toast.hide { animation: toastFade 0.3s ease-in forwards; }
        @keyframes toastPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes toastFade { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } }
        #dialog-box { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 700px; background-color: rgba(15, 23, 42, 0.95); border: 4px solid #ffffff; padding: 20px; z-index: 1000; display: none; align-items: stretch; gap: 20px; box-shadow: 10px 10px 0px rgba(0,0,0,0.8); cursor: pointer; }
        #dialog-avatar { width: 100px; height: 100px; border: 4px solid #fff; flex-shrink: 0; background: #94a3b8; }
        #dialog-content { display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        #dialog-name { font-family: 'Press Start 2P', monospace; font-size: 18px; color: #facc15; text-shadow: 2px 2px 0px #000; margin-bottom: 12px; }
        #dialog-text { font-family: 'Press Start 2P', monospace; font-size: 16px; color: white; line-height: 1.5; text-shadow: 2px 2px 0px #000; }
        #dialog-prompt { font-family: 'Press Start 2P', monospace; font-size: 12px; color: #facc15; text-align: right; text-shadow: 2px 2px 0px #000; margin-top: 10px; animation: flashClock 1s infinite; display: none; }
        #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-end; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: max(18px, env(safe-area-inset-bottom)); transition: opacity 0.2s ease; }
        /* Touch controls: flat, minimal, same look as the scoreboard / panels (dark glass + white outline + hard shadow). */
        :root { --u: 3; --ctl: clamp(84px, 22vmin, 116px); }
        #joystick-zone { width: var(--ctl); height: var(--ctl); flex: 0 0 auto; background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.55); border-radius: 50%; position: relative; pointer-events: auto; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; touch-action: none; box-sizing: border-box; }
        #joystick-knob { width: 38%; height: 38%; background: rgba(255,255,255,0.55); border: 0; border-radius: 50%; pointer-events: none; transition: transform 0.05s linear; position: relative; z-index: 1; }
        #action-btn { width: calc(var(--ctl) * 0.62); height: calc(var(--ctl) * 0.62); flex: 0 0 auto; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; font-family: 'Press Start 2P', monospace; color: rgba(255,255,255,0.85); font-size: clamp(12px, 3.6vmin, 18px); text-shadow: 1px 1px 0 rgba(0,0,0,0.6); margin-bottom: 16px; touch-action: none; user-select: none; -webkit-user-select: none; box-sizing: border-box; transition: background-color 0.06s, transform 0.06s; }
        #action-btn:active, #action-btn.active-touch { background: rgba(255,255,255,0.38); transform: scale(0.94); }
        /* Pass-type badge (bottom centre, between the stick and the button) */
        #pass-hud { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 9; pointer-events: none; display: none; flex-direction: column; align-items: center; gap: 6px; font-family: 'Press Start 2P', monospace; }
        #pass-hud.show { display: flex; }
        #pass-hud-pill { --pc: #fb923c; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(15,23,42,0.88); border: 3px solid var(--pc); border-radius: 6px; box-shadow: 3px 3px 0 rgba(0,0,0,0.7), 0 0 0 0 var(--pc); color: var(--pc); font-size: 11px; letter-spacing: 1px; text-shadow: 2px 2px 0 #000; transition: border-color 0.18s, color 0.18s; }
        #pass-hud-pill.lob { --pc: #7dd3fc; }
        #pass-hud-pill svg { width: 22px; height: 14px; display: block; overflow: visible; }
        #pass-hud-pill.pop { animation: passPop 0.34s cubic-bezier(0.2, 1.6, 0.4, 1); }
        #pass-hud-pill.bullet.pop svg { animation: passSlideB 0.34s ease-out; }
        #pass-hud-pill.lob.pop svg { animation: passBounceL 0.42s ease-out; }
        @keyframes passPop { 0% { transform: scale(0.82); box-shadow: 3px 3px 0 rgba(0,0,0,0.7), 0 0 0 0 var(--pc); } 45% { transform: scale(1.16); box-shadow: 3px 3px 0 rgba(0,0,0,0.7), 0 0 0 7px transparent; } 100% { transform: scale(1); } }
        @keyframes passSlideB { 0% { transform: translateX(-10px); opacity: 0; } 60% { transform: translateX(3px); opacity: 1; } 100% { transform: translateX(0); } }
        @keyframes passBounceL { 0% { transform: translateY(8px); opacity: 0; } 55% { transform: translateY(-4px); opacity: 1; } 100% { transform: translateY(0); } }
        #pass-hud-hint { font-size: 7px; color: #cbd5e1; text-shadow: 1px 1px 0 #000; letter-spacing: 0.5px; opacity: 0.85; white-space: nowrap; }
        @media (hover: hover) and (pointer: fine) { #mobile-controls, #joystick-zone, #action-btn { pointer-events: none !important; } }
        .icon-btn { padding: 12px; font-size: 16px; background-color: #334155; border-color: #64748b; }
        /* controlled-player nameplate (bottom center) */
        #player-tag { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%) scale(var(--player-tag-scale, .7)); transform-origin: center bottom; z-index: 1500; display: none; align-items: center; gap: 10px; padding: 8px 14px; background: rgba(11,18,32,.88); border: 3px solid #facc15; box-shadow: 4px 4px 0 rgba(0,0,0,.8); font-family: 'Press Start 2P', monospace; color: #fff; text-shadow: 2px 2px 0 #000; pointer-events: none; white-space: nowrap; max-width: 60vw; }
        #player-tag .pt-name { font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
        #player-tag .pt-pos { font-size: 9px; color: #0b1220; background: #facc15; padding: 4px 6px; text-shadow: none; }
        #player-tag .pt-ovr { font-size: 9px; color: #94a3b8; } #player-tag .pt-ovr b { font-weight: normal; font-size: 13px; color: var(--oc, #4ade80); }
        @media (max-width: 700px) { #player-tag { padding: 6px 10px; gap: 7px; } #player-tag .pt-name { font-size: 8px; } #player-tag .pt-pos, #player-tag .pt-ovr { font-size: 7px; } #player-tag .pt-ovr b { font-size: 10px; } }
</style>
</head>
<body>
    <div id="ui-container" class="ui-layer"></div>

    <div id="td-banner">
        <div class="td-main" id="td-banner-main">TOUCHDOWN!!</div>
        <div class="td-sub" id="td-banner-sub">YOU SCORE! +6</div>
    </div>
    <div id="penalty-toast">DELAY OF GAME! -5 YARDS</div>

    <div id="dialog-box" onclick="advanceDialog()">
        <div id="dialog-avatar"></div>
        <div id="dialog-content"><div id="dialog-name">HEAD COACH</div><div id="dialog-text"></div><div id="dialog-prompt">TAP HERE TO CONTINUE</div></div>
    </div>

    <!-- PAUSE BUTTON -->
    <button id="btn-pause" class="retro-btn icon-btn" style="position:absolute; top: max(20px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right)); z-index: 3500; display: none; padding: 10px 14px; font-size: 14px;" onclick="togglePause()">||</button>

    <div id="hud" class="hud-text"></div>
    <div id="play-clock"><div class="pc-label">PLAY CLOCK</div><div class="pc-value" id="pc-value">15</div></div>
    <div id="down-distance">1ST &amp; 10</div>
    
    <div id="scoreboard">
        <div class="sb-team you"><div class="sb-possession" id="sb-poss-you"></div><div class="sb-label" id="sb-label-you">YOU</div><div class="sb-score" id="sb-score-you">0</div></div>
        <div class="sb-center"><div class="sb-quarter" id="sb-quarter">Q1</div><div class="sb-clock" id="sb-clock">3:00</div></div>
        <div class="sb-team cpu"><div class="sb-score" id="sb-score-cpu">0</div><div class="sb-label" id="sb-label-cpu">CPU</div><div class="sb-possession flip" id="sb-poss-cpu"></div></div>
    </div>

    <div id="mobile-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="action-btn">X</div>
    </div>
    <div id="pass-hud"><div id="pass-hud-pill" class="bullet"><span id="pass-hud-ico"></span><span id="pass-hud-name">BULLET</span></div><div id="pass-hud-hint"></div></div>
    
    <canvas id="gameCanvas"></canvas>


        <script id="ui-click-sfx">
    /* Button click sound: every completed button tap/click (not scrolls or drags), at most once per 0.2s. Works with browser autoplay rules (incl. iOS Safari / home-screen app). */

                ['def','CB','CB'],['def','CB','CB'],['def','CB','CB'],['def','LB','MLB'],['def','LB','MLB'],['def','S','S'],
                ['st','K','K']
            ];
            const OFFS = { OL: { SPD: -17, AGI: -14 }, DL: { SPD: -8 }, QB: { SPD: -8, AGI: -6 }, WR: { STR: -18 }, CB: { TKL: -12, STR: -18 }, LB: { COV: -8 }, RB: { STR: -6 }, TE: { SPD: -10, AGI: -8 }, S: { STR: -14 } };
            const NUM_RANGE = { QB:[1,19], WR:[80,89], OL:[60,79], DL:[90,99], LB:[40,59], CB:[20,39], K:[1,19], RB:[22,49], TE:[80,89], S:[20,39] };
            const calcOvr = p => Math.round(POS[p.pos].a.reduce((s, [k,,w]) => s + p.attrs[k] * w, 0));

// ---- how every rating really changes the game (the game code calls these same formulas) ----
            const FX = {
                speed: (a, line, base) => { const s = gv(a, 'SPD', 78); return line ? 0.052 * (1 + (s - 62) * 0.011) : base * (1 + (s - 78) * (s >= 78 ? 0.0085 : 0.0095)); },
                throwRange: a => Math.max(17, 22.5 + (gv(a, 'THP', 78) - 70) * 1.12),                       // yards
                hangMul: a => clamp(1 - (gv(a, 'THP', 78) - 78) * 0.0045, 0.85, 1.15),       // ball flight time
                scatter: (a, dist, pressured) => Math.max(0, 99 - gv(a, 'THA', 78)) * 0.055 * (0.5 + dist / 40) * (pressured ? clamp(1.7 - (gv(a, 'AWR', 78) - 60) * 0.012, 1.0, 2.2) : 1),
                qbDiff: a => clamp(((gv(a, 'THA', 78) + gv(a, 'AWR', 78)) / 2 - 78) / 14, -1.2, 1.2),
                kickMul: a => { const s = gv(a, 'KPW', 78); return s >= 78 ? 1 + (s - 78) * 0.0038 : 1 + (s - 78) * 0.0058; },
                kickScatter: (a, q4) => { let k = gv(a, 'KAC', 78); if (q4) k += (gv(a, 'CLU', 78) - 78) * 0.4; return Math.max(0, 100 - k) * 0.0016; },
                catchAdj: (w, d) => clamp((gv(w, 'HND', 78) - 78) * 0.0065 + (gv(w, 'JMP', 78) - 78) * 0.002 - (gv(d, 'COV', 78) - 78) * 0.004, -0.45, 0.2),
                handsAdj: w => clamp((gv(w, 'HND', 78) - 78) * 0.0065, -0.45, 0.04),
                sepBonus: (w, d) => clamp((gv(w, 'RTE', 78) - 78) * 0.008 + (gv(w, 'AGI', 70) - gv(d, 'AGI', 70)) * 0.004, -0.6, 0.6),
                intAdj: d => (gv(d, 'INT', gv(d, 'AWR', 70)) - 78) * 0.004,
                blockRating: (a, pass) => a && a.PBK != null ? (pass ? a.PBK : a.RBK) * 0.55 + gv(a, 'STR', 60) * 0.30 + gv(a, 'AWR', 70) * 0.15 : 60,
                shedRating: (a, pass) => a && a.PRS != null ? (pass ? a.PRS : a.STR) * 0.7 + a.STR * 0.3 : (a && a.TKL != null && a.STR != null && a.AWR != null ? (a.TKL + a.STR) / 2 : 55),
                shedFrames: (d, b, pass) => clamp((FX.shedRating(d, pass) - FX.blockRating(b, pass)) * 1.1, -45, 45),
                fatigue: a => clamp(1 + (70 - gv(a, 'STA', 70)) * 0.012, 0.6, 1.3),                 // how fast a player tires (1 = average)
                staMul: st => st >= 55 ? 1 : 0.72 + 0.28 * Math.max(0, st) / 55,                // speed once tired (down to -28%)
                whiff: (c, h) => clamp(0.08 + ((gv(c, 'AGI', 60) + gv(c, 'STR', 55)) / 2 - gv(h, 'TKL', 60)) * 0.011, 0.02, 0.45)
            };

            
function buildRoster(teamIdx, seed, tgt) {
                const t = tgt ? Object.assign({}, qpTeams[teamIdx], tgt) : qpTeams[teamIdx]; let h = teamIdx * 9973 + 17; for (const c of String(seed || '')) h = (h * 31 + c.charCodeAt(0)) | 0;
                const rnd = mulberry(h), pick = a => a[Math.floor(rnd() * a.length)];
                const usedNames = new Set(), usedNums = new Set(); const target = { off: t.off, def: t.def, st: t.ovr };
                const roster = SLOTS.map(([grp, pos, role], i) => {
                    let name; do { name = pick(FIRST) + ' ' + pick(LAST); } while (usedNames.has(name)); usedNames.add(name);
                    const [lo, hi] = NUM_RANGE[pos]; let num, g = 0; do { num = lo + Math.floor(rnd() * (hi - lo + 1)); } while (usedNums.has(num) && g++ < 80); usedNums.add(num);
                    const base = target[grp] + (rnd() * 12 - 6), attrs = {}, off = OFFS[pos] || {};
                    POS[pos].a.forEach(([k,,w]) => { attrs[k] = clamp(Math.round(base + (off[k] || 0) + (rnd() * ((pos === 'QB' && k === 'THP') ? 6 : 16) - ((pos === 'QB' && k === 'THP') ? 3 : 8)) + (w >= .25 ? 3 : 0)), 30, 99); });
                    const girth = (pos === 'OL') ? 1.45 + rnd() * 0.25 : (pos === 'DL') ? 1.35 + rnd() * 0.22 : (pos === 'LB') ? 1.08 + rnd() * 0.1 : (pos === 'TE') ? 1.18 + rnd() * 0.12 : 0.95 + rnd() * 0.14;
                    return { id: 'p' + i, name, pos, role, grp, num, skin: SKIN_TONES[Math.floor(rnd() * SKIN_TONES.length)], girth, attrs };
                });
                // nudge each unit so its average lands on the school's real offense / defense / kicker rating
                ['off','def','st'].forEach(grp => {
                    const list = roster.filter(p => p.grp === grp);
                    for (let n = 0; n < 8; n++) {
                        const avg = list.reduce((s, p) => s + calcOvr(p), 0) / list.length, d = Math.round(target[grp] - avg); if (!d) break;
                        list.forEach(p => Object.keys(p.attrs).forEach(k => { p.attrs[k] = clamp(p.attrs[k] + d, 30, 99); }));
                    }
                });
                roster.forEach(p => { p.ovr = calcOvr(p); });
                // a quarterback's arm strength tracks his overall, so a 70-75 QB tops out around 23-28 yards and a 95 around 51
                const qb = roster.find(p => p.pos === 'QB'); if (qb) { qb.attrs.THP = clamp(qb.ovr + Math.round(rnd() * 2 - 1), 40, 99); qb.ovr = calcOvr(qb); }
                return roster;
            }
            
            // Rosters are built once per team and reused for the whole game.
            function rosterFor(idx) { return rosterCache[idx] || (rosterCache[idx] = buildRoster(idx, 'cpu')); }

window.StatsBridge = {
                active() { return true; },
                teamIdx(isCPU) { const away = qpState.playerSide === 'AWAY'; return isCPU ? (away ? qpState.homeIdx : qpState.awayIdx) : (away ? qpState.awayIdx : qpState.homeIdx); },
                // give every body on the field the roster player it represents
                assign() {
                    players.forEach(p => { p.st = null; p.rp = null; }); if (!this.active()) return;
                    [false, true].forEach(isCPU => {
                        const roster = rosterFor(this.teamIdx(isCPU)), byPos = {}, used = new Set(); roster.forEach(r => (byPos[r.pos] = byPos[r.pos] || []).push(r));
                        const take = pos => { const l = byPos[pos] || []; while (l.length) { const r = l.shift(); if (!used.has(r)) { used.add(r); return r; } } return null; };
                        const bodies = players.filter(p => !p.isRef && p.isCPU === isCPU), isOff = p => (offenseDirection === -1) ? !p.isCPU : p.isCPU;
                        bodies.forEach(p => { if (p.isKicker) p.rp = take('K'); else if (p.isQB) p.rp = take('QB'); else if (p.isRB) p.rp = take('RB') || take('WR'); else if (p.isTE) p.rp = take('TE') || take('WR'); else if (p.isMLB) p.rp = take('LB'); else if (p.isSafety) p.rp = take('S') || take('CB'); else if (p.isReturner) p.rp = take('WR'); });
                        bodies.forEach(p => { if (!p.rp && p.isLineman) p.rp = take(isOff(p) ? 'OL' : 'DL'); });
                        bodies.forEach(p => { if (p.rp) return; if (isOff(p)) p.rp = take('WR'); else p.rp = (p.isCB || p.aiRole === 'MAN' || p.aiRole === 'PRESS') ? take('CB') : (take('LB') || take('CB')); });
                        bodies.forEach(p => { if (!p.rp) { const r = roster.find(x => !used.has(x)); if (r) { used.add(r); p.rp = r; } } });
                        bodies.forEach(p => { if (p.rp) p.st = p.rp.attrs; });
                    });
                },
                STA_DRAIN: 0.085, STA_REGEN: 0.008, STA_REST: 100,   // per-tick drain at a full sprint, per-tick recovery standing still, recovery between plays
                resetStamina() { Object.values(rosterCache).forEach(r => r.forEach(p => { p.stam = 100; })); },
                staMul(st) { return FX.staMul(st); },
                pushFactor(b, d) { if (!b || !d || !b.st || !d.st) return 1; return clamp(1 - FX.shedFrames(d.st, b.st, false) / 45, 0.3, 1.9); },
                tickStamina() {
                    if (!this.active()) return;
                    const live = gameState === 'PLAYING' || gameState === 'BALL_IN_AIR' || gameState === 'BALL_LOOSE';
                    for (const p of players) {
                        if (!p.rp || !p.st || p.isRef) continue;
                        if (p.baseSpeed == null) p.baseSpeed = p.speed;
                        const moved = Math.hypot(p.x - (p._sx == null ? p.x : p._sx), p.y - (p._sy == null ? p.y : p._sy)); p._sx = p.x; p._sy = p.y;
                        let s = p.rp.stam == null ? 100 : p.rp.stam; const inten = live ? Math.min(1.5, moved / (p.baseSpeed || 0.08)) : 0;
                        if (inten > 0.25) s -= this.STA_DRAIN * inten * FX.fatigue(p.st); else s += this.STA_REGEN;
                        s = Math.max(0, Math.min(100, s)); p.rp.stam = s; p.speed = p.baseSpeed * FX.staMul(s);
                        if (p === player && live && s < 40 && Math.random() < (0.5 - s / 100) * 0.5) spawnSweat(p);
                    }
                },
                speedFor(p) { return FX.speed(p.st, !!p.isLineman, p === player ? 0.086 : 0.082); },
                throwRange(p) { return p && p.st && p.st.THP != null ? FX.throwRange(p.st) : 999; },
                hangMul(p) { return p && p.st && p.st.THP != null ? FX.hangMul(p.st) : 1; },
                pressured(p) { const n = players.filter(e => e.isCPU !== p.isCPU && e.isLineman).sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y))[0]; return !!n && Math.hypot(n.x - p.x, n.y - p.y) < 3.5; },
                scatter(p, dist) { return p && p.st && p.st.THA != null ? FX.scatter(p.st, dist, this.pressured(p)) : 0; },
                qbDiff(p) { return p && p.st && p.st.THA != null ? FX.qbDiff(p.st) : cpuDifficulty; },
                kickMul(p) { return p && p.st && p.st.KPW != null ? FX.kickMul(p.st) : 1; },
                kickScatter(p) { return p && p.st && p.st.KAC != null ? FX.kickScatter(p.st, quarter >= 4) : 0; },
                catchAdj(w, d) { return (w && w.st && d && d.st) ? FX.catchAdj(w.st, d.st) : 0; },
                handsAdj(w) { return w && w.st ? FX.handsAdj(w.st) : 0; },
                sepBonus(w, d) { return (w && w.st && d && d.st) ? FX.sepBonus(w.st, d.st) : 0; },
                intAdj(d) { return d && d.st ? FX.intAdj(d.st) : 0; },
                shedDiff(d, b, fallback, pass) { if (!d || !b || !d.st || !b.st) return fallback; return FX.shedFrames(d.st, b.st, !!pass) + fallback * 0.25; },
                tackleMiss(c, h) {
                    if (!c || !h || !c.st || !h.st) return false; const now = performance.now();
                    if (h === player) return false;   // YOUR tackles always count: contact is a tackle (the CPU carrier can still dodge you with real movement, but never with an invisible 'miss')
                    if (h._missUntil && now < h._missUntil) return true;
                    if (h._rollT && now - h._rollT < 1200) return false; h._rollT = now;
                    if (Math.random() < FX.whiff(c.st, h.st)) { h._missUntil = now + 800; if (h !== player) { h.isMissedTackle = true; h.missedTackleTimer = 0; h.isLunging = false; } return true; }
                    return false;
                }
            };

        })();


        // =====================================================================
        //  BOOT: straight into a full game against the CPU
        // =====================================================================
        document.fonts.ready.then(function () {
            initTextures();
            window.addEventListener('resize', resize); resize();
            startMatch();
            requestAnimationFrame(loop);
        });

    </script>
